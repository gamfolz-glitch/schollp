events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    server_tokens off;
    client_max_body_size 10M;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    keepalive_timeout 65;
    sendfile on;
    
    # Глобальные прокси-параметры
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    upstream django {
        server web:8000;
    }

    # HTTP → HTTPS редирект
    server {
        listen 80;
        server_name pollapp.ru;

        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name pollapp.ru;

        # SSL настройки (будут настроены после получения сертификатов)
        ssl_certificate /etc/letsencrypt/live/pollapp.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pollapp.ru/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Безопасность
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Статические файлы
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Медиа файлы
        location /media/ {
            alias /app/media/;
            expires 1m;
            access_log off;
        }

        # Django приложение
        location / {
            proxy_pass http://django;
            proxy_redirect off;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Блокировка чувствительных файлов
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* (\.py|\.pyc|\.sql|\.sqlite|\.sqlite3|\.env)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}